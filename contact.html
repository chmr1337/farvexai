<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Farvex AI</title>
  <style>
/* Reset & Base */
*,*::before,*::after{box-sizing:border-box;}
html {
  scroll-behavior: smooth;
  scroll-snap-type: y proximity;
}
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #020205;
  color: #e2e8f0;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* Variables */
:root {
  --bg: #000000; --bg2: #050508; --bg3: #0a0a0f;
  --glass: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.08);
  --glass-hover: rgba(255,255,255,0.06);
  --t1: #ffffff; --t2: #94a3b8; --t3: #475569;
  --cyan: #00f0ff; --cyan-g: rgba(0,240,255,0.2);
  --purple: #b026ff; --purple-g: rgba(176,38,255,0.2);
  --brand-grad: linear-gradient(135deg, var(--cyan), var(--purple));
}

/* Scroll snap containers */
.snap-section {
  scroll-snap-align: start;
}

/* Background Effects */
.bg-mesh {
  position: fixed; inset: 0; z-index: -2;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(0,240,255,0.08), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(176,38,255,0.08), transparent 40%);
  filter: blur(60px);
  pointer-events: none;
}
.bg-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: 
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 80%);
}

/* Utilities */
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px;
  transition: all 0.3s ease; cursor: pointer; border: none; gap: 8px;
}
.btn-primary {
  background: var(--brand-grad); color: #000;
  box-shadow: 0 4px 20px var(--purple-g);
}
.btn-primary:hover {
  transform: translateY(-2px); box-shadow: 0 8px 30px var(--cyan-g); filter: brightness(1.1);
}
.btn-glass {
  background: var(--glass); border: 1px solid var(--glass-border); color: #fff;
  backdrop-filter: blur(12px);
}
.btn-glass:hover {
  background: var(--glass-hover); border-color: var(--cyan);
}

/* ===========================
   AUTOMEX-STYLE HEADER
   =========================== */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(2, 2, 5, 0.7); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  transition: all 0.3s ease;
}
.nav-container {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 24px; height: 80px;
  max-width: 1400px; margin: 0 auto; padding: 0 32px;
}
.logo {
  font-weight: 800; font-size: 22px; color: #fff;
  display: flex; align-items: center; gap: 12px; letter-spacing: -0.03em;
}
.logo-img {
  height: 48px;
  width: auto;
  display: block;
}
.nav-links {
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.nav-item {
  position: relative;
}
.nav-link {
  padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
  color: var(--t2); transition: all 0.2s; display: flex; align-items: center; gap: 6px;
}
.nav-link:hover {
  color: #fff; background: var(--glass);
}
/* Mega Menu Dropdown */
.mega-menu {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(10px);
  width: 600px; background: rgba(10,10,15,0.95); backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 24px; opacity: 0; visibility: hidden; transition: all 0.3s ease;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px inset rgba(255,255,255,0.05);
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  pointer-events: none;
}
.nav-item:hover .mega-menu {
  opacity: 1; visibility: visible; transform: translateX(-70%) translateY(0);
  pointer-events: auto;
}
.mega-col h4 {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--t3); margin-bottom: 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--glass-border);
}
.mega-link {
  display: flex; align-items: flex-start; gap: 12px; padding: 12px;
  border-radius: 8px; transition: all 0.2s;
}
.mega-link:hover {
  background: var(--glass-hover); border-color: var(--cyan);
}
.mega-icon {
  width: 32px; height: 32px; border-radius: 6px; background: var(--glass);
  display: flex; align-items: center; justify-content: center;
  color: var(--cyan); flex-shrink: 0; font-size: 14px; border: 1px solid var(--glass-border);
}
.mega-link:hover .mega-icon {
  background: var(--cyan-g); border-color: var(--cyan); color: #fff;
}
.mega-text {
  display: flex; flex-direction: column; gap: 4px;
}
.mega-title { font-size: 14px; font-weight: 600; color: #fff; }
.mega-desc { font-size: 12px; color: var(--t2); line-height: 1.4; }

.nav-right {
  display: flex; align-items: center; gap: 16px;
}
.lang-toggle {
  display: flex; background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 6px; padding: 4px;
}
.lang-toggle button {
  background: transparent; border: none; color: var(--t3); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600;
}
.lang-toggle button.active {
  background: rgba(255,255,255,0.1); color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.05);
}

/* ===========================
   CENTERED HERO (FULL SCREEN)
   =========================== */
.hero {
  height: 100vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 80px 24px 0;
  position: relative; overflow: hidden;
}
.hero-content {
  max-width: 900px; display: flex; flex-direction: column; align-items: center;
  z-index: 2;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cyan); background: var(--cyan-g);
  border: 1px solid rgba(0,240,255,0.3); border-radius: 100px;
  padding: 6px 16px; margin-bottom: 32px;
}
.hero-badge .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: 0.5; box-shadow: 0 0 20px var(--cyan); } }

.hero h1 {
  font-size: clamp(48px, 6vw, 85px); line-height: 1.05; letter-spacing: -0.04em;
  font-weight: 800; margin-bottom: 24px;
}
.hero h1 .gradient-text {
  background: linear-gradient(to right, #fff, var(--t2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero h1 .brand-text {
  background: var(--brand-grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  display: inline-block; padding-bottom: 10px;
}
.hero p {
  font-size: clamp(16px, 2vw, 20px); color: var(--t2); max-width: 650px;
  margin: 0 auto 40px; line-height: 1.6;
}
.hero-actions {
  display: flex; gap: 16px; justify-content: center;
}

/* ===========================
   SPACIOUS SERVICES GRID
   =========================== */
.services-section {
  padding: 160px 0;
  background: linear-gradient(to bottom, transparent, var(--bg2));
  position: relative;
}
.section-header {
  text-align: center; margin-bottom: 80px;
}
.section-header h2 {
  font-size: clamp(32px, 4vw, 48px); margin-bottom: 16px;
}
.section-header p {
  color: var(--t2); font-size: 18px; max-width: 600px; margin: 0 auto;
}

.services-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;
}
@media (max-width: 1024px) { .services-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .services-grid { grid-template-columns: 1fr; } }

.service-card {
  background: var(--bg3); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 40px; transition: all 0.4s ease;
  position: relative; overflow: hidden; display: flex; flex-direction: column;
}
.service-card::before {
  content: ""; position: absolute; inset: 0; background: var(--brand-grad);
  opacity: 0; transition: opacity 0.4s ease; z-index: 0; mix-blend-mode: overlay;
}
.service-card:hover {
  transform: translateY(-8px); border-color: var(--cyan);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px var(--cyan-g);
}
.service-card:hover::before { opacity: 0.1; }
.service-content { position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; }
.sc-icon {
  width: 56px; height: 56px; border-radius: 12px; background: var(--glass);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  border: 1px solid var(--glass-border); margin-bottom: 24px; color: var(--cyan);
  transition: all 0.4s ease;
}
.service-card:hover .sc-icon {
  background: var(--brand-grad); color: #000; border-color: transparent;
  box-shadow: 0 0 20px var(--cyan-g);
}
.service-card h3 {
  font-size: 22px; margin-bottom: 16px; letter-spacing: -0.01em;
}
.service-card p {
  color: var(--t2); font-size: 15px; margin-bottom: 24px; line-height: 1.7; flex-grow: 1;
}
.sc-link {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan);
  display: inline-flex; align-items: center; gap: 8px; margin-top: auto;
}
.sc-link span { transition: transform 0.3s ease; }
.service-card:hover .sc-link span { transform: translateX(5px); }


.sc-extra {
  max-height: 0; opacity: 0; overflow: hidden;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  margin-top: 0;
}
.sc-extra ul {
  padding-left: 20px; margin: 0 0 12px 0; color: var(--t2); font-size: 14px;
}
.sc-extra ul li { margin-bottom: 6px; }
.sc-extra p { font-size: 14px; color: var(--t1); margin: 0; }
.sc-extra strong { color: var(--cyan); }
.service-card:hover .sc-extra {
  max-height: 300px; opacity: 1; margin-top: 16px;
}



/* Calendly Modal Overrides */
.modal-content { max-width: 800px !important; padding: 20px !important; overflow: hidden; }
.modal-title { margin-bottom: 5px !important; }
.modal-sub { margin-bottom: 0 !important; }

/* ===========================
   MODAL
   =========================== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s ease;
}
.modal-overlay.active {
  opacity: 1; visibility: visible;
}
.modal-content {
  background: var(--bg3); border: 1px solid var(--glass-border);
  border-radius: 16px; width: 100%; max-width: 500px; padding: 40px;
  position: relative; transform: translateY(20px); transition: all 0.3s ease;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px var(--cyan-g);
}
.modal-overlay.active .modal-content {
  transform: translateY(0);
}
.modal-close {
  position: absolute; top: 16px; right: 16px; background: transparent;
  border: none; color: var(--t2); font-size: 24px; cursor: pointer; transition: color 0.2s;
}
.modal-close:hover { color: #fff; }
.modal-title {
  font-size: 24px; margin-bottom: 8px; color: #fff;
}
.modal-title span { color: var(--cyan); }
.modal-sub {
  color: var(--t2); font-size: 14px; margin-bottom: 24px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block; font-size: 12px; font-weight: 600; color: var(--t3);
  margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
}
.form-control {
  width: 100%; background: var(--bg2); border: 1px solid var(--glass-border);
  border-radius: 8px; padding: 12px 16px; color: #fff; font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
}
.form-control:focus {
  outline: none; border-color: var(--cyan); background: rgba(255,255,255,0.02);
}
textarea.form-control { resize: vertical; min-height: 100px; }
.modal-submit { width: 100%; margin-top: 8px; }

/* ===========================
   DEMO PIPELINE (Centered & Wide)
   =========================== */
.demo-section {
  padding: 160px 0; border-top: 1px solid var(--glass-border);
  background: #000;
}
.terminal-wrapper {
  background: var(--bg3); border: 1px solid var(--glass-border); border-radius: 12px;
  max-width: 900px; margin: 0 auto; text-align: left;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(0,240,255,0.05);
  overflow: hidden; font-family: 'JetBrains Mono', monospace;
  display: flex; flex-direction: column;
}
.term-header {
  background: var(--bg2); padding: 12px 20px; border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center; gap: 8px;
}
.term-dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-r { background: #ff5f56; } .dot-y { background: #ffbd2e; } .dot-g { background: #27c93f; }
.term-title { margin-left: 12px; color: var(--t3); font-size: 12px; }
.term-body {
  padding: 30px; font-size: 14px; min-height: 350px; color: var(--t2); line-height: 1.6;
}
.term-line { margin-bottom: 12px; }
.term-user { color: #fff; }
.term-user::before { content: "user@farvex:~$ "; color: var(--cyan); }
.term-ai { color: #a3e635; display: none; }
.term-ai::before { content: "AI Agent: "; color: var(--purple); }
.term-spinner { display: none; color: var(--t3); margin-bottom: 12px; }
.cursor {
  display: inline-block; width: 8px; height: 16px; background: #fff;
  animation: blink 1s step-end infinite; vertical-align: middle;
}
@keyframes blink { 50% { opacity: 0; } }

.term-btn-wrap { text-align: center; margin-top: 40px; }


/* ===========================
   NEW SECTIONS (Marquee, Industries, Process, Testimonials)
   =========================== */
/* Layout structure */
.section { padding: 120px 0; border-top: 1px solid var(--glass-border); position: relative; }
.section.bg-darker { background: #050505; }
.sec-title { text-align: center; margin-bottom: 60px; }
.sec-title h2 { font-size: 36px; margin-bottom: 16px; font-weight: 700; color: #fff; }
.sec-title p { color: var(--t2); max-width: 600px; margin: 0 auto; font-size: 16px; line-height: 1.6; }

/* Marquee */
.marquee-container {
  overflow: hidden; white-space: nowrap; padding: 40px 0; border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border);
  background: var(--bg2); display: flex; align-items: center;
}
.marquee-content {
  display: inline-block; animation: marquee 30s linear infinite; padding-left: 100%;
}
.marquee-content span {
  display: inline-block; padding: 0 40px; font-size: 24px; font-weight: 700; color: var(--t3); letter-spacing: 2px; text-transform: uppercase;
}
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

/* Industries Grid */
.industries-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin-top: 40px; }
.industry-card {
  background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 30px 24px;
  text-align: center; transition: all 0.3s;
}
.industry-card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 10px 30px rgba(0, 240, 255, 0.1); }
.industry-icon { font-size: 40px; margin-bottom: 16px; display: block; }
.industry-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
.industry-desc { font-size: 14px; color: var(--t2); line-height: 1.5; }

/* Process Timeline */
.process-wrapper {
  display: flex; justify-content: space-between; gap: 20px; margin-top: 60px; position: relative;
}
.process-wrapper::before {
  content: ''; position: absolute; top: 30px; left: 0; width: 100%; height: 2px; background: var(--glass-border); z-index: 0;
}
.process-step {
  flex: 1; text-align: center; position: relative; z-index: 1;
}
.process-number {
  width: 60px; height: 60px; line-height: 60px; margin: 0 auto 20px; background: var(--bg1); border: 2px solid var(--cyan);
  border-radius: 50%; font-size: 24px; font-weight: 700; color: var(--cyan); box-shadow: 0 0 20px var(--cyan-g);
}
.process-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 12px; }
.process-desc { font-size: 14px; color: var(--t2); }
@media (max-width: 768px) {
  .process-wrapper { flex-direction: column; gap: 40px; }
  .process-wrapper::before { display: none; }
}

/* Testimonials */
.testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 40px; }
.testi-card { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 30px; position: relative; }
.testi-quote { font-size: 16px; color: var(--t1); font-style: italic; margin-bottom: 24px; line-height: 1.6; }
.testi-author { font-size: 14px; font-weight: 600; color: var(--cyan); }
.testi-company { font-size: 12px; color: var(--t3); }

/* Expanded Footer */
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
.f-brand h3 { font-size: 24px; font-weight: 700; margin-bottom: 16px; color: #fff; }
.f-brand p { color: var(--t2); font-size: 14px; line-height: 1.6; max-width: 300px; }
.f-col h4 { font-size: 16px; color: #fff; margin-bottom: 20px; font-weight: 600; }
.f-col ul { list-style: none; }
.f-col ul li { margin-bottom: 12px; }
.f-col ul li a { color: var(--t2); text-decoration: none; font-size: 14px; transition: color 0.2s; }
.f-col ul li a:hover { color: var(--cyan); }
@media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; } }


/* ===========================
   PHASE 2 SECTIONS (About, Tech Stack, FAQ, CTA)
   =========================== */
/* About Section */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; margin-top: 40px; }
.about-text h3 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 20px; }
.about-text p { font-size: 16px; color: var(--t2); line-height: 1.7; margin-bottom: 20px; }
.about-visual { 
  background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(163,230,53,0.1));
  border: 1px solid var(--cyan-g); border-radius: 24px; padding: 60px; text-align: center;
  box-shadow: 0 0 50px rgba(0,240,255,0.05);
}
.about-visual h4 { font-size: 48px; color: var(--cyan); margin-bottom: 10px; font-weight: 800; text-shadow: 0 0 20px var(--cyan); }
.about-visual p { color: #fff; font-size: 18px; font-weight: 600; }
@media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; } }

/* Tech Stack */
.stack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 40px; }
.stack-card { background: var(--bg3); border: 1px solid var(--glass-border); border-radius: 16px; padding: 40px 30px; }
.stack-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.stack-tags { display: flex; flex-wrap: wrap; gap: 10px; }
.stack-tag { background: var(--bg2); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 20px; font-size: 13px; color: var(--t1); font-weight: 500; }

/* FAQ */
.faq-wrapper { max-width: 800px; margin: 40px auto 0; text-align: left; }
.faq-item { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.faq-btn { 
  width: 100%; text-align: left; background: none; border: none; padding: 24px; font-size: 18px; font-weight: 600; color: #fff; 
  cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: 'Inter', sans-serif;
}
.faq-content { padding: 0 24px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.faq-content p { padding-bottom: 24px; color: var(--t2); line-height: 1.6; }
.faq-item.active .faq-content { max-height: 200px; }
.faq-item.active .faq-btn { color: var(--cyan); }
.faq-icon { transition: transform 0.3s; }
.faq-item.active .faq-icon { transform: rotate(45deg); }

/* CTA Banner */
.cta-banner { 
  background: linear-gradient(90deg, #0f172a, #001220); border: 1px solid var(--glass-border);
  border-radius: 24px; padding: 80px 40px; text-align: center; margin: 80px auto; max-width: 1000px;
  position: relative; overflow: hidden;
}
.cta-banner::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, transparent 60%); z-index: 0;
}
.cta-content { position: relative; z-index: 1; }
.cta-content h2 { font-size: 40px; font-weight: 800; color: #fff; margin-bottom: 24px; }
.cta-content p { font-size: 18px; color: var(--t2); margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto; }


/* ===========================
   REFLECT AI INSPIRED SECTIONS (Benefits & Calculator)
   =========================== */
/* Core Benefits */
.benefits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 20px; }
.benefit-card { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 16px; padding: 40px 30px; text-align: left; }
.benefit-icon { font-size: 32px; margin-bottom: 20px; color: var(--cyan); }
.benefit-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; }
.benefit-desc { font-size: 15px; color: var(--t2); line-height: 1.6; }

/* ===========================
   INTEGRATIONS FLOW DIAGRAM
   =========================== */
.integration-diagram { display: flex; align-items: center; justify-content: center; max-width: 1000px; margin: 60px auto 0; gap: 40px; }
.flow-col { display: flex; flex-direction: column; gap: 20px; z-index: 2; }
.flow-node { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px 25px; color: #fff; font-weight: 600; font-size: 14px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: relative; }
.flow-node.highlight { background: rgba(0,240,255,0.1); border-color: var(--cyan); text-shadow: 0 0 10px var(--cyan-g); }

.flow-core-wrap { position: relative; z-index: 2; }
.flow-core { background: linear-gradient(135deg, var(--bg1), #000); border: 2px solid var(--cyan); border-radius: 50%; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #fff; text-align: center; box-shadow: 0 0 40px rgba(0,240,255,0.4); animation: pulse-core 3s infinite; }

@keyframes pulse-core {
  0% { box-shadow: 0 0 30px rgba(0,240,255,0.2); transform: scale(1); }
  50% { box-shadow: 0 0 60px rgba(0,240,255,0.6); transform: scale(1.02); }
  100% { box-shadow: 0 0 30px rgba(0,240,255,0.2); transform: scale(1); }
}

.flow-connectors { display: flex; align-items: center; justify-content: center; color: var(--cyan); font-size: 24px; animation: flow-slide 2s infinite linear; }
@keyframes flow-slide {
  0% { transform: translateX(-5px); opacity: 0.5; }
  50% { transform: translateX(5px); opacity: 1; }
  100% { transform: translateX(-5px); opacity: 0.5; }
}

@media (max-width: 768px) {
  .integration-diagram { flex-direction: column; gap: 20px; }
  .flow-connectors { transform: rotate(90deg); margin: 10px 0; }
  @keyframes flow-slide { 
    0% { transform: translateY(-5px) rotate(90deg); opacity: 0.5; }
    50% { transform: translateY(5px) rotate(90deg); opacity: 1; }
    100% { transform: translateY(-5px) rotate(90deg); opacity: 0.5; }
  }
}


/* ===========================
   COMPARISON SECTION
   =========================== */
.comparison-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1100px; margin: 40px auto 0; }
.comp-card { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.comp-card.old-way { border-top: 4px solid #ff4a4a; }
.comp-card.new-way { border-top: 4px solid var(--cyan); background: linear-gradient(135deg, rgba(0,240,255,0.05), transparent); }

.comp-header { font-size: 24px; font-weight: 800; margin-bottom: 30px; text-align: center; }
.old-way .comp-header { color: #ff4a4a; }
.new-way .comp-header { color: var(--cyan); text-shadow: 0 0 15px var(--cyan-g); }

.comp-list { list-style: none; padding: 0; margin: 0; }
.comp-list li { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; font-size: 15px; color: var(--t2); line-height: 1.6; }
.comp-list li:last-child { margin-bottom: 0; }
.comp-icon { flex-shrink: 0; font-size: 18px; margin-top: 2px; }
.old-way .comp-icon { color: #ff4a4a; }
.new-way .comp-icon { color: var(--cyan); }
.new-way .comp-list li { color: #fff; }

@media (max-width: 900px) { .comparison-wrapper { grid-template-columns: 1fr; } }

/* ===========================
   FOOTER
   =========================== */
footer {
  background: var(--bg2); padding: 60px 0 40px; border-top: 1px solid var(--glass-border);
}
.footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; margin-bottom: 60px;
}
@media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; } }
.f-col p { color: var(--t2); font-size: 14px; margin-top: 16px; max-width: 300px; }
.f-col h4 { font-size: 16px; margin-bottom: 20px; }
.f-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.f-col ul a { color: var(--t2); font-size: 14px; transition: color 0.2s; }
.f-col ul a:hover { color: #fff; }
.f-bottom {
  border-top: 1px solid var(--glass-border); padding-top: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--t3);
}

</head>

  <script>
    const T = {
      'en': {
        'header.back': '← Back to Home',
        'c.h1': 'Get in Touch',
        'c.sub': 'Have a question or want to discuss a custom AI automation solution? Reach out to us directly.',
        'c.email': 'Email Us',
        'c.phone': 'Call Us',
        'c.f.name': 'Name',
        'c.f.email': 'Email',
        'c.f.msg': 'Message',
        'c.f.btn': 'Send Message'
      },
      'nl': {
        'header.back': '← Terug naar Home',
        'c.h1': 'Neem Contact Op',
        'c.sub': 'Heeft u een vraag of wilt u een op maat gemaakte AI-oplossing bespreken? Neem direct contact met ons op.',
        'c.email': 'E-mail Ons',
        'c.phone': 'Bel Ons',
        'c.f.name': 'Naam',
        'c.f.email': 'E-mail',
        'c.f.msg': 'Bericht',
        'c.f.btn': 'Verstuur Bericht'
      }
    };

    function setLang(l) {
      document.documentElement.setAttribute('data-lang', l);
      localStorage.setItem('farvex_lang', l);
      
      document.getElementById('btnEN').classList.toggle('active', l==='en');
      document.getElementById('btnNL').classList.toggle('active', l==='nl');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (T[l] && T[l][k]) {
          el.innerHTML = T[l][k];
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem('farvex_lang') || 'en';
      setLang(savedLang);
    });
  </script>
